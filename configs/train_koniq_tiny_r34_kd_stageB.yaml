mode: tiny_r34_kd
dataset: koniq
image_root: data
train_split: data/metas/koniq_train.json
val_split: data/metas/koniq_test.json
output_dir: outputs/koniq_tiny_r34_kd_stageB
epochs: 80
batch_size: 32
lr: 1e-4
optimizer: adamw
loss:
  type: mse_srcc
  alpha: 0.2
model:
  use_se: true
  hidden_dim1: 512
  hidden_dim2: 256
  dropout_p: 0.1
kd:
  enabled: true
  stage: "B"
  alpha: 0.1
  teacher_ckpt: outputs/koniq_baseline/resnet_baseline_best.pth
  stageA_ckpt: outputs/koniq_tiny_r34_kd_stageA/tiny_r34_kd_stageA.pth
device: cuda
seed: 42

